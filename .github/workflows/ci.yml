name: CI/CD Pipeline - Build, Publish & Sync Infra

on:
  push:
    branches: [ "main" ]

jobs:
  # Dependencies, Linting & Unit testing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest flask==3.0.3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: pytest -v

  # Docker image build, security scan, publishing and infrastructure sync
  build-and-sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      # Get commit short hash
      - name: Set short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build local image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/devops-flask-api:${{ steps.vars.outputs.sha_short }}

      - name: Scan image for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/devops-flask-api:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'  
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/devops-flask-api:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.ACR_NAME }}.azurecr.io/devops-flask-api:latest

      # Get infrastructure repository, update image tag and commit
      - name: Update Terraform configuration in infra repo
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha_short }}
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
          INFRA_REPO: "kindel-devops-lab/kindel-devops-lab-IaC-CD"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://${GH_TOKEN}@github.com/${INFRA_REPO}.git infra
          cd infra

          echo "image_tag = \"${NEW_TAG}\"" > terraform.tfvars

          if ! git diff --quiet; then
            git add terraform.tfvars
            git commit -m "ci: bump flask-api image tag to ${NEW_TAG}"
            git push origin main
          else
            echo "No change detected in terraform.tfvars"
          fi